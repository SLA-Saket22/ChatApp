services:
  backend:
    build: ./server
    ports:
      - "5050:5050" 
    networks:
      - mern
    environment:
      MONGO_URI: mongodb://root1:root@ac-yc9scv6-shard-00-00.h9sav1z.mongodb.net:27017,ac-yc9scv6-shard-00-01.h9sav1z.mongodb.net:27017,ac-yc9scv6-shard-00-02.h9sav1z.mongodb.net:27017/chat-app?ssl=true&replicaSet=atlas-5y6n0x-shard-0&authSource=admin&retryWrites=true&w=majority 
    depends_on:
      - mongodb

  frontend:
    build: ./client
    ports:
      - "5173:5173"  
    networks:
      - mern
    environment:
      REACT_APP_API_URL: http://localhost:5000

  mongodb:
    image: mongo:latest  
    ports:
      - "27017:27017"  
    networks:
      - mern
    volumes:
      - mongo-data:/data/db  

networks:
  mern:
    driver: bridge 

volumes:
  mongo-data:
    driver: local  # Persist MongoDB data locally